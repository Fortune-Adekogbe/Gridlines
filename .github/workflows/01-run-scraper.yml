name: Scrape Grid Data

on:
  # schedule:
  #   - cron: '30 7 * * *'
  workflow_dispatch: {}  # Add workflow dispatch for manual triggering
  
jobs:
  scrape-grid-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Securely upgrade pip
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Installing package list
        run: apt list --installed

      - name: Removing previous chrome instances on runner 
        run: sudo apt purge google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install xvfb
        run: sudo apt-get install xvfb

      - name: Pass Environment Variables and Run Scripts
        env:
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          
        run: |
          # Pass the API_TOKEN secret as an environment variable to your script
          python update_db.py