name: Scrape Alternate Grid Data

on:
  schedule:
    - cron: '* 8 * * *'
  workflow_dispatch: {}  # Add workflow dispatch for manual triggering
  
jobs:
  scrape-grid-data:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
      SE_CHROMEDRIVER: /usr/bin/chromedriver

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Securely upgrade pip
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Installing package list
        run: apt list --installed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Chrome and ChromeDriver startup
        run: |
          "$CHROME_BIN" --version
          "$SE_CHROMEDRIVER" --version
          timeout 30s python - <<'PY'
          import subprocess

          from selenium.webdriver.chrome.service import Service
          from selenium_setup import create_driver

          service = Service(service_args=["--verbose"], log_output=subprocess.STDOUT)
          with create_driver(service=service) as driver:
              driver.get("about:blank")
          PY

      - name: Pass Environment Variables and Run Scripts
        env:
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          
        run: |
          # Pass the API_TOKEN secret as an environment variable to your script
          python alt_scraper.py
